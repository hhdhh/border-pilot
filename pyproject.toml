[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "border-pilot"
version = "0.1.0"
description = "Multi-agent workflow platform for cross-border e-commerce: trend scouting, market analysis, and multi-language listing generation orchestrated by LangGraph."
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
authors = [
 {name = "Ding Xianghao", email = "your-email@example.com"},
]
keywords = ["agent", "langgraph", "ai-agent", "cross-border", "e-commerce", "llm"]
classifiers = [
 "Development Status ::4 - Beta",
 "Intended Audience :: Developers",
 "License :: OSI Approved :: MIT License",
 "Programming Language :: Python ::3.9",
 "Programming Language :: Python ::3.10",
 "Programming Language :: Python ::3.11",
 "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

dependencies = [
 "langgraph>=0.2.0",
 "langchain-core>=0.3.0",
 "anthropic>=0.40.0",
 "gradio>=4.0.0",
 "pydantic>=2.0",
 "python-dotenv>=1.0.0",
]

[project.optional-dependencies]
dev = [
 "pytest>=8.0.0",
 "huggingface-hub>=0.20.0",
]

[project.scripts]
border-pilot = "border_pilot.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
